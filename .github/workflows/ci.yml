name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Design tokens are covered by the same suite - a colour change that drops a label below
      # 4.5:1 fails here rather than shipping.

  fixtures:
    name: fixtures still broken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The fixtures must keep failing. If one starts passing, the demo silently has nothing to do.
      - run: node scripts/check-fixtures.mjs

  ui:
    name: ui tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      # The rail is the safety surface: it is what a person reads before approving something
      # irreversible. It gets the same treatment as the rules behind it.
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
